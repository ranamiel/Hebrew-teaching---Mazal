<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חלוקה להברות</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .word-image-container {
      text-align: center;
      margin: 10px 0 20px;
      animation: bounceIn 0.5s ease;
    }

    .word-image-container img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .word-image-container .emoji-fallback {
      font-size: 8rem;
      user-select: none;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 600px) {
      .word-image-container img { width: 150px; height: 150px; }
      .word-image-container .emoji-fallback { font-size: 6rem; }
    }

    .syllable-boxes {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 25px 0;
      direction: ltr;
    }

    .syllable-box {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 4px solid var(--warm-peach);
      background: var(--white);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: transparent;
      user-select: none;
    }

    .syllable-box:hover {
      border-color: var(--warm-orange);
      transform: scale(1.1);
    }

    .syllable-box.filled {
      background: var(--warm-orange);
      border-color: var(--warm-red);
      color: var(--white);
      transform: scale(1.05);
    }

    .syllable-box.correct {
      background: #4CAF50;
      border-color: #388E3C;
      color: var(--white);
    }

    .syllable-box.incorrect {
      background: var(--warm-coral);
      border-color: var(--warm-red);
      color: var(--white);
      animation: shake 0.4s ease;
    }

    .count-display {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-medium);
      margin: 10px 0;
      min-height: 2rem;
    }

    .syllable-reveal {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--warm-red);
      margin: 15px 0;
      direction: rtl;
      letter-spacing: 2px;
    }

    @media (max-width: 600px) {
      .syllable-box { width: 50px; height: 50px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="container activity-page">
    <div class="activity-header">
      <h1>חלוקה להברות</h1>
      <button class="btn btn-back" onclick="window.location.href='../../index.html'">← חזרה לתפריט</button>
    </div>

    <!-- בחירת רמת קושי -->
    <div class="difficulty-selector" id="difficulty-selector">
      <button class="difficulty-btn easy active" data-diff="easy" onclick="SyllablesActivity.setDifficulty('easy')">קל</button>
      <button class="difficulty-btn medium" data-diff="medium" onclick="SyllablesActivity.setDifficulty('medium')">בינוני</button>
      <button class="difficulty-btn hard" data-diff="hard" onclick="SyllablesActivity.setDifficulty('hard')">קשה</button>
    </div>

    <div class="progress-bar">
      <div class="fill" id="progress-fill" style="width: 0%"></div>
    </div>

    <div class="activity-content" id="activity-area">
      <div class="word-display">
        <p id="instruction-text" style="font-size: 1.2rem; color: var(--text-medium); margin-bottom: 10px;"></p>

        <!-- תמונה של המילה במקום טקסט -->
        <div class="word-image-container" id="word-image-container"></div>

        <button class="btn btn-secondary" id="play-word-btn" style="margin-bottom: 20px;">
          🔊 <span id="play-btn-text"></span>
        </button>
      </div>

      <!-- משבצות לספירת הברות -->
      <div class="syllable-boxes" id="syllable-boxes"></div>
      <div class="count-display" id="count-display"></div>

      <div style="text-align: center;">
        <button class="btn btn-primary" id="check-btn" style="display: none;">
          <span id="check-btn-text">בדוק!</span>
        </button>
      </div>

      <div id="feedback-area"></div>

      <!-- הצגת ההברות אחרי תשובה נכונה -->
      <div class="syllable-reveal" id="syllable-reveal" style="display: none;"></div>

      <div class="nav-controls">
        <button class="btn btn-primary" id="next-btn" style="display: none;">
          <span id="next-btn-text">המילה הבאה</span> →
        </button>
      </div>
    </div>
  </div>

  <script src="../../js/speech.js"></script>
  <script src="../../js/progress.js"></script>
  <script>
    const SyllablesActivity = {
      allWords: {},
      words: [],
      currentIndex: 0,
      currentDifficulty: 'easy',
      selectedCount: 0,
      maxBoxes: 5,
      state: {},

      async init() {
        const saved = localStorage.getItem('hebrewReadingState');
        if (saved) this.state = JSON.parse(saved);

        try {
          const res = await fetch('../../data/words.json');
          const data = await res.json();
          this.allWords = data.syllables;
        } catch (e) {
          console.error('Could not load words:', e);
          return;
        }

        Progress.load(this.state.childName || 'default');

        this.updateGenderText();
        this.setDifficulty('easy');
        this.bindEvents();
      },

      updateGenderText() {
        const g = this.state.gender || 'boy';
        const texts = {
          boy: {
            instruction: 'הקשב למילה. כמה הברות שמעת?',
            playBtn: 'שמע שוב',
            checkBtn: 'בדוק!',
          },
          girl: {
            instruction: 'הקשיבי למילה. כמה הברות שמעת?',
            playBtn: 'שמעי שוב',
            checkBtn: 'בדקי!',
          }
        };
        document.getElementById('instruction-text').textContent = texts[g].instruction;
        document.getElementById('play-btn-text').textContent = texts[g].playBtn;
        document.getElementById('check-btn-text').textContent = texts[g].checkBtn;
      },

      setDifficulty(diff) {
        this.currentDifficulty = diff;
        this.words = this.shuffleArray([...(this.allWords[diff] || [])]);
        this.currentIndex = 0;

        document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.querySelector(`.difficulty-btn[data-diff="${diff}"]`);
        if (activeBtn) activeBtn.classList.add('active');

        Progress.setTotal(this.state.childName || 'default', `syllables-${diff}`, this.words.length);

        this.showWord();
      },

      showWord() {
        if (this.currentIndex >= this.words.length) {
          this.showComplete();
          return;
        }

        const word = this.words[this.currentIndex];

        // הצגת תמונה אמיתית במקום אימוג'י
        const imageContainer = document.getElementById('word-image-container');
        if (word.image) {
          imageContainer.innerHTML = `<img src="${word.image}" alt="${word.plain}" onerror="this.parentElement.innerHTML='<span class=\\'emoji-fallback\\'>${word.emoji || '❓'}</span>'">`;
        } else {
          imageContainer.innerHTML = `<span class="emoji-fallback">${word.emoji || '❓'}</span>`;
        }

        // איפוס
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('feedback-area').innerHTML = '';
        document.getElementById('syllable-reveal').style.display = 'none';
        document.getElementById('count-display').textContent = '';
        this.selectedCount = 0;

        // בניית משבצות
        this.buildBoxes();
        this.updateProgress();

        // השמעה אוטומטית
        this.playCurrentWord();
      },

      buildBoxes() {
        const container = document.getElementById('syllable-boxes');
        container.innerHTML = '';

        for (let i = 1; i <= this.maxBoxes; i++) {
          const box = document.createElement('button');
          box.className = 'syllable-box';
          box.textContent = i;
          box.dataset.num = i;
          box.addEventListener('click', () => this.selectCount(i));
          container.appendChild(box);
        }
      },

      selectCount(num) {
        // לא לאפשר שינוי אחרי בדיקה
        if (document.querySelector('.syllable-box.correct') || document.querySelector('.syllable-box.incorrect')) return;

        this.selectedCount = num;

        // עדכון ויזואלי - מילוי עד למספר הנבחר
        document.querySelectorAll('.syllable-box').forEach(box => {
          const boxNum = parseInt(box.dataset.num);
          if (boxNum <= num) {
            box.classList.add('filled');
          } else {
            box.classList.remove('filled');
          }
        });

        const g = this.state.gender || 'boy';
        const countWord = num === 1 ? 'הברה אחת' : `${num} הברות`;
        document.getElementById('count-display').textContent = countWord;

        // הצגת כפתור בדיקה
        document.getElementById('check-btn').style.display = 'inline-flex';
      },

      checkAnswer() {
        const word = this.words[this.currentIndex];
        const correctCount = word.syllableCount || word.syllables.length;

        if (this.selectedCount === correctCount) {
          this.onCorrect();
        } else {
          this.onIncorrect(correctCount);
        }
      },

      onCorrect() {
        const g = this.state.gender || 'boy';
        const msg = g === 'girl' ? 'מצוינת! 🎉' : 'מצוין! 🎉';
        document.getElementById('feedback-area').innerHTML = `<div class="feedback success">${msg}</div>`;

        // צביעה ירוקה
        document.querySelectorAll('.syllable-box.filled').forEach(b => {
          b.classList.remove('filled');
          b.classList.add('correct');
        });

        document.getElementById('check-btn').style.display = 'none';

        // הצגת ההברות
        const word = this.words[this.currentIndex];
        const reveal = document.getElementById('syllable-reveal');
        reveal.textContent = word.word + ' = ' + word.syllables.join(' - ');
        reveal.style.display = 'block';

        Progress.completeItem(
          this.state.childName || 'default',
          'syllables',
          `${this.currentDifficulty}-${this.currentIndex}`
        );

        document.getElementById('next-btn').style.display = 'inline-flex';
      },

      onIncorrect(correctCount) {
        const g = this.state.gender || 'boy';
        const msg = g === 'girl' ? 'לא בדיוק... נסי שוב!' : 'לא בדיוק... נסה שוב!';
        document.getElementById('feedback-area').innerHTML = `<div class="feedback error">${msg}</div>`;

        // צביעה אדומה
        document.querySelectorAll('.syllable-box.filled').forEach(b => {
          b.classList.remove('filled');
          b.classList.add('incorrect');
        });

        document.getElementById('check-btn').style.display = 'none';

        // איפוס אחרי השהיה
        setTimeout(() => {
          this.selectedCount = 0;
          document.querySelectorAll('.syllable-box').forEach(b => {
            b.classList.remove('filled', 'incorrect');
          });
          document.getElementById('feedback-area').innerHTML = '';
          document.getElementById('count-display').textContent = '';
        }, 2000);
      },

      playCurrentWord() {
        const word = this.words[this.currentIndex];
        if (!word) return;
        Speech.playAudio(word.audio).catch(() => {
          Speech.speak(word.plain);
        });
      },

      showComplete() {
        const g = this.state.gender || 'boy';
        const finishMsg = g === 'girl' ? 'סיימת את כל המילים ברמה הזו! כל הכבוד!' : 'סיימת את כל המילים ברמה הזו! כל הכבוד!';
        document.getElementById('activity-area').innerHTML = `
          <div style="text-align: center; padding: 50px 20px;">
            <div style="font-size: 3rem; margin-bottom: 20px;">🎉</div>
            <h2 style="color: var(--warm-red); margin-bottom: 15px;">${finishMsg} 🌟</h2>
            <button class="btn btn-primary" onclick="window.location.reload()">
              רוצה לנסות רמה אחרת
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='../../index.html'" style="margin-top: 10px;">
              חזרה לתפריט
            </button>
          </div>
        `;
      },

      updateProgress() {
        const pct = Math.round((this.currentIndex / this.words.length) * 100);
        document.getElementById('progress-fill').style.width = pct + '%';
      },

      bindEvents() {
        document.getElementById('next-btn').addEventListener('click', () => {
          this.currentIndex++;
          this.showWord();
        });

        document.getElementById('play-word-btn').addEventListener('click', () => {
          this.playCurrentWord();
        });

        document.getElementById('check-btn').addEventListener('click', () => {
          this.checkAnswer();
        });
      },

      shuffleArray(arr) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }
    };

    document.addEventListener('DOMContentLoaded', () => SyllablesActivity.init());
  </script>

</body>
</html>
