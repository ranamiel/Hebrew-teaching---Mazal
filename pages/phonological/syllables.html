<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חלוקה להברות</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div class="container activity-page">
    <div class="activity-header">
      <h1>חלוקה להברות</h1>
      <button class="btn btn-back" onclick="window.location.href='../../index.html'">← חזרה לתפריט</button>
    </div>

    <!-- בחירת רמת קושי -->
    <div class="difficulty-selector" id="difficulty-selector">
      <button class="difficulty-btn easy active" data-diff="easy" onclick="SyllablesActivity.setDifficulty('easy')">קל</button>
      <button class="difficulty-btn medium" data-diff="medium" onclick="SyllablesActivity.setDifficulty('medium')">בינוני</button>
      <button class="difficulty-btn hard" data-diff="hard" onclick="SyllablesActivity.setDifficulty('hard')">קשה</button>
    </div>

    <div class="progress-bar">
      <div class="fill" id="progress-fill" style="width: 0%"></div>
    </div>

    <div class="activity-content" id="activity-area">
      <div class="word-display" id="word-display">
        <p id="instruction-text" style="font-size: 1.2rem; color: var(--text-medium); margin-bottom: 20px;"></p>
        <div class="word" id="current-word"></div>
        <button class="btn btn-secondary" id="play-word-btn" style="margin-bottom: 20px;">
          🔊 <span id="play-btn-text"></span>
        </button>
      </div>

      <div class="syllable-container" id="syllable-container"></div>

      <div id="feedback-area"></div>

      <div class="nav-controls">
        <button class="btn btn-primary" id="next-btn" style="display: none;">
          <span id="next-btn-text">המילה הבאה</span> →
        </button>
      </div>
    </div>
  </div>

  <script src="../../js/speech.js"></script>
  <script src="../../js/progress.js"></script>
  <script>
    const SyllablesActivity = {
      allWords: {},
      words: [],
      currentIndex: 0,
      currentDifficulty: 'easy',
      state: {},

      async init() {
        const saved = localStorage.getItem('hebrewReadingState');
        if (saved) this.state = JSON.parse(saved);

        try {
          const res = await fetch('../../data/words.json');
          const data = await res.json();
          this.allWords = data.syllables;
        } catch (e) {
          console.error('Could not load words:', e);
          return;
        }

        Progress.load(this.state.familyName || 'default');

        this.updateGenderText();
        this.setDifficulty('easy');
        this.bindEvents();
      },

      updateGenderText() {
        const g = this.state.gender || 'boy';
        const texts = {
          boy: { instruction: 'הקשב למילה ולחץ על ההברות בסדר הנכון', playBtn: 'שמע את המילה' },
          girl: { instruction: 'הקשיבי למילה ולחצי על ההברות בסדר הנכון', playBtn: 'שמעי את המילה' }
        };
        document.getElementById('instruction-text').textContent = texts[g].instruction;
        document.getElementById('play-btn-text').textContent = texts[g].playBtn;
      },

      setDifficulty(diff) {
        this.currentDifficulty = diff;
        this.words = this.allWords[diff] || [];
        this.currentIndex = 0;

        document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.querySelector(`.difficulty-btn[data-diff="${diff}"]`);
        if (activeBtn) activeBtn.classList.add('active');

        Progress.setTotal(this.state.familyName || 'default', `syllables-${diff}`, this.words.length);

        this.showWord();
      },

      showWord() {
        if (this.currentIndex >= this.words.length) {
          this.showComplete();
          return;
        }

        const word = this.words[this.currentIndex];
        document.getElementById('current-word').textContent = word.word;
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('feedback-area').innerHTML = '';

        const container = document.getElementById('syllable-container');
        container.innerHTML = '';

        const shuffled = this.shuffleArray([...word.syllables]);
        shuffled.forEach((syl) => {
          const block = document.createElement('button');
          block.className = 'syllable-block';
          block.textContent = syl;
          block.addEventListener('click', () => this.handleSyllableClick(block, syl));
          container.appendChild(block);
        });

        this.selectedOrder = [];
        this.updateProgress();
      },

      selectedOrder: [],

      handleSyllableClick(block, syllable) {
        if (block.classList.contains('highlighted')) return;

        block.classList.add('highlighted');
        this.selectedOrder.push(syllable);

        const word = this.words[this.currentIndex];

        if (this.selectedOrder.length === word.syllables.length) {
          const correct = this.selectedOrder.every((s, i) => s === word.syllables[i]);
          if (correct) {
            this.onCorrect();
          } else {
            this.onIncorrect();
          }
        }
      },

      onCorrect() {
        const g = this.state.gender || 'boy';
        const msg = g === 'girl' ? 'מצוינת! 🎉' : 'מצוין! 🎉';
        document.getElementById('feedback-area').innerHTML = `<div class="feedback success">${msg}</div>`;

        document.querySelectorAll('.syllable-block').forEach(b => {
          b.classList.remove('highlighted');
          b.classList.add('correct');
        });

        Progress.completeItem(
          this.state.familyName || 'default',
          'syllables',
          `${this.currentDifficulty}-${this.currentIndex}`
        );

        document.getElementById('next-btn').style.display = 'inline-flex';
      },

      onIncorrect() {
        const g = this.state.gender || 'boy';
        const word = this.words[this.currentIndex];
        const msg = g === 'girl' ? 'לא בדיוק... נסי שוב!' : 'לא בדיוק... נסה שוב!';
        const feedbackArea = document.getElementById('feedback-area');
        feedbackArea.innerHTML = `<div class="feedback error">${msg}</div>`;

        const hint = `הסדר הנכון: ${word.syllables.join(' - ')}`;
        setTimeout(() => {
          feedbackArea.innerHTML += `<div class="feedback info">${hint}</div>`;
        }, 800);

        setTimeout(() => {
          this.selectedOrder = [];
          document.querySelectorAll('.syllable-block').forEach(b => {
            b.classList.remove('highlighted');
          });
          feedbackArea.innerHTML = '';
        }, 3000);
      },

      showComplete() {
        const g = this.state.gender || 'boy';
        document.getElementById('activity-area').innerHTML = `
          <div style="text-align: center; padding: 50px 20px;">
            <div style="font-size: 3rem; margin-bottom: 20px;">🎉</div>
            <h2 style="color: var(--warm-red); margin-bottom: 15px;">סיימת את כל המילים ברמה הזו! כל הכבוד! 🌟</h2>
            <button class="btn btn-primary" onclick="window.location.reload()">
              רוצה לנסות רמה אחרת
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='../../index.html'" style="margin-top: 10px;">
              חזרה לתפריט
            </button>
          </div>
        `;
      },

      updateProgress() {
        const pct = Math.round((this.currentIndex / this.words.length) * 100);
        document.getElementById('progress-fill').style.width = pct + '%';
      },

      bindEvents() {
        document.getElementById('next-btn').addEventListener('click', () => {
          this.currentIndex++;
          this.showWord();
        });

        document.getElementById('play-word-btn').addEventListener('click', () => {
          const word = this.words[this.currentIndex];
          Speech.playAudio(word.audio).catch(() => {
            Speech.speak(word.plain);
          });
        });
      },

      shuffleArray(arr) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }
    };

    document.addEventListener('DOMContentLoaded', () => SyllablesActivity.init());
  </script>

</body>
</html>
